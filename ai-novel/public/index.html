<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小说模块</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4dccf;
      --paper: #f6f1e8;
      --card: #fffaf3;
      --accent: #8c3d22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.6 "Iowan Old Style", Palatino, "Songti SC", "Noto Serif SC", serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 36px 20px 72px; }
    a { color: var(--accent); }
    h1, h2 { font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
    h1 { font-size: 46px; margin: 8px 0 12px; }
    .eyebrow { margin: 0; letter-spacing: 0.14em; text-transform: uppercase; font: 700 12px/1.4 sans-serif; color: var(--accent); }
    .lede, .dim { color: var(--muted); }
    .card, .book {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin-top: 14px;
    }
    label { display: flex; flex-direction: column; gap: 6px; font: 600 13px/1.4 sans-serif; color: var(--muted); }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: 16px/1.6 inherit;
      padding: 10px 12px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 160px 160px; gap: 12px; }
    .grid label:first-child { grid-column: 1 / -1; }
    button, .back {
      font: 600 14px/1 sans-serif;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    .back { background: transparent; color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .book-link { display: block; text-align: left; background: var(--card); color: inherit; border-color: var(--line); width: 100%; }
    .error { color: #8c2f22; }
    .prose { white-space: pre-wrap; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; padding: 0; margin: 0; list-style: none; }
    .tags li { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font: 14px/1.6 sans-serif; }
    @media (max-width: 720px) {
      h1 { font-size: 34px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app')

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[char])
    }

    async function api(path, options) {
      const response = await fetch(path, options)
      const payload = await response.json().catch(() => ({}))
      if (!response.ok || payload.ok === false) throw new Error(payload.message || '请求没有完成')
      return payload.data
    }

    function parseSse(block) {
      const lines = block.split('\n').filter(Boolean)
      if (!lines.length) return null
      let event = 'message'
      const data = []
      for (const line of lines) {
        if (line.startsWith('event:')) event = line.slice(6).trim()
        if (line.startsWith('data:')) data.push(line.slice(5).trim())
      }
      if (!data.length) return null
      try { return { event, data: JSON.parse(data.join('\n')) } } catch { return null }
    }

    function statusText(status) {
      if (status === 'ready') return '故事方向已生成'
      if (status === 'running') return '正在生成'
      if (status === 'failed') return '没有生成完'
      return '还没生成'
    }

    function lobby(books, error) {
      app.innerHTML = `
        <p class="eyebrow">织界旁边 · AI Novel Generator</p>
        <h1>起一本书</h1>
        <p class="lede">这里不改织界里的小说页。它单独跑上游的建书流程：创意，完整故事，核心种子，然后是书名和世界观。模型默认用织界设置页里已启用的文本模型。</p>
        <form class="card" id="form">
          <div class="grid">
            <label>创意
              <textarea name="user_idea" required maxlength="20000" placeholder="一个想法就够。谁遇上了什么事。"></textarea>
            </label>
            <label>章节数
              <input name="number_of_chapters" type="number" min="1" max="10000" value="100" required />
            </label>
            <label>每章字数
              <input name="words_per_chapter" type="number" min="1" max="100000" value="3000" required />
            </label>
          </div>
          <div class="row"><button type="submit">生成故事方向</button></div>
          ${error ? `<p class="error">${escapeHtml(error)}</p>` : ''}
        </form>
        ${books.length ? `<h2>书库</h2><div class="row">${books.map(book => `
          <button class="book-link" type="button" data-id="${book.id}">
            <strong>${escapeHtml(book.title || book.user_idea)}</strong>
            <span class="dim">${escapeHtml(statusText(book.status))}${book.genre ? ' · ' + escapeHtml(book.genre) : ''}</span>
          </button>`).join('')}</div>` : ''}
      `
      app.querySelector('#form').addEventListener('submit', async (event) => {
        event.preventDefault()
        const form = new FormData(event.currentTarget)
        const button = event.currentTarget.querySelector('button')
        button.disabled = true
        try {
          const book = await api('/api/books', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_idea: String(form.get('user_idea') || '').trim(),
              number_of_chapters: Number(form.get('number_of_chapters')),
              words_per_chapter: Number(form.get('words_per_chapter')),
            }),
          })
          location.hash = `#/books/${book.id}/generate`
        } catch (err) {
          button.disabled = false
          lobby(books, err.message)
        }
      })
      for (const button of app.querySelectorAll('[data-id]')) {
        button.addEventListener('click', () => { location.hash = `#/books/${button.dataset.id}` })
      }
    }

    function section(label, text) {
      if (!text) return ''
      return `<section class="card"><h2>${escapeHtml(label)}</h2><p class="prose">${escapeHtml(text)}</p></section>`
    }

    function renderBook(book, step, error) {
      const document = book.document || {}
      const tags = Array.isArray(document.tags) ? document.tags : []
      app.innerHTML = `
        <a class="back" href="#/">← 书库</a>
        <p class="eyebrow">${escapeHtml(document.genre || '小说')}</p>
        <h1>${escapeHtml(book.title || '新的小说')}</h1>
        ${document.subtitle ? `<p class="lede">${escapeHtml(document.subtitle)}</p>` : ''}
        <p class="dim">${book.number_of_chapters} 章 · 每章约 ${book.words_per_chapter} 字${document.tone ? ' · ' + escapeHtml(document.tone) : ''}</p>
        <p class="prose">${escapeHtml(book.user_idea)}</p>
        ${book.status === 'ready' ? '' : `<section class="card">
          <p>${escapeHtml(step || (book.status === 'failed' ? '这一轮没有生成完。可以再试一次。' : '创意已经记下。'))}</p>
          ${error ? `<p class="error">${escapeHtml(error)}</p>` : ''}
          <button id="generate" type="button" ${step ? 'disabled' : ''}>${book.status === 'failed' ? '重新生成' : '生成故事方向'}</button>
        </section>`}
        ${book.status !== 'ready' ? '' : [
          section('核心设想', document.core_idea),
          section('核心种子', document.core_seed),
          section('引言', document.introduction),
          section('简介', document.summary),
          section('世界观', document.worldview),
          section('创作风格', [document.writing_style, document.narrative_pov, document.era_background].filter(Boolean).join(' · ')),
          tags.length ? `<section class="card"><h2>标签</h2><ul class="tags">${tags.map(tag => `<li>${escapeHtml(tag)}</li>`).join('')}</ul></section>` : '',
          section('完整故事', document.plot),
        ].join('')}
      `
      const button = app.querySelector('#generate')
      if (button) button.addEventListener('click', () => generate(book.id))
    }

    async function generate(id) {
      const book = await api(`/api/books/${id}`)
      renderBook(book, '正在生成故事方向')
      const response = await fetch(`/api/books/${id}/direction`, { method: 'POST' })
      if (!response.ok || !response.body) {
        const payload = await response.json().catch(() => ({}))
        throw new Error(payload.message || '故事方向没有生成')
      }
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''
      let failure = ''
      let latest = book
      const consume = (block) => {
        const event = parseSse(block)
        if (!event) return
        if (event.event === 'step' && event.data.status === 'start') renderBook(latest, event.data.label || '正在生成故事方向')
        if (event.event === 'error') failure = event.data.message || '故事方向没有生成'
        if (event.event === 'done' && event.data.book) latest = event.data.book
      }
      while (true) {
        const { done, value } = await reader.read()
        if (done) break
        buffer += decoder.decode(value, { stream: true })
        const parts = buffer.split('\n\n')
        buffer = parts.pop() || ''
        for (const part of parts) consume(part)
      }
      consume(buffer)
      if (failure) throw new Error(failure)
      if (latest.status !== 'ready') latest = await api(`/api/books/${id}`)
      renderBook(latest)
    }

    async function draw() {
      const hash = location.hash || '#/'
      const generateMatch = hash.match(/^#\/books\/(\d+)\/generate$/)
      const bookMatch = hash.match(/^#\/books\/(\d+)$/)
      try {
        if (generateMatch || bookMatch) {
          const id = Number((generateMatch || bookMatch)[1])
          const book = await api(`/api/books/${id}`)
          if (generateMatch && book.status !== 'ready' && book.status !== 'running') {
            history.replaceState(null, '', `#/books/${id}`)
            await generate(id)
            return
          }
          renderBook(book, book.status === 'running' ? '正在生成，请稍候' : '')
          return
        }
        lobby(await api('/api/books'), '')
      } catch (error) {
        if (generateMatch || bookMatch) {
          app.innerHTML = `<a class="back" href="#/">← 书库</a><p class="error">${escapeHtml(error.message)}</p>`
          return
        }
        lobby([], error.message)
      }
    }

    window.addEventListener('hashchange', draw)
    draw()
  </script>
</body>
</html>
